name: Registry CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: registry-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugins & lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout registry
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Lint scripts
        run: make check

      - name: Test scripts
        run: make test

      - name: Validate all plugins
        run: make validate

      - name: Verify index.yaml is current
        run: |
          make generate
          if ! git diff --exit-code index.yaml; then
            echo "::error::index.yaml is stale. Run 'make generate' and commit the result."
            exit 1
          fi
