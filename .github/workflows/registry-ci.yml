name: Registry CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: registry-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  validate:
    name: Validate plugins & lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout registry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Lint scripts
        run: make check

      - name: Test scripts
        run: make test

      - name: Scan history for credentials
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --verbose .

      - name: Validate all plugins
        run: make validate

      - name: Verify index.yaml is current
        run: |
          make generate
          if ! git diff --exit-code index.yaml; then
            echo "::error::index.yaml is stale. Run 'make generate' and commit the result."
            exit 1
          fi
