# The eval arms, as data: the single record of what each arm is and why it
# exists. armsfile.py parses and validates this file; model-eval.sh resolves
# an arm through it and nothing else.
#
# Fields:
#   id              single-letter label used in write-ups.
#   key             slug. Appears in the run id (<date>_<key>_<image-tag>).
#   provider        Hindsight LLM provider name: ollama, openrouter, groq,
#                   openai, anthropic, or another name the image accepts
#                   (Hindsight validates it at boot; a wrong one fails the
#                   eval container before anything is spent). An
#                   OpenAI-compatible endpoint that is none of these is
#                   'openai' with base_url set.
#   model           passed to the provider verbatim, no prefixing.
#   base_url        empty means the provider's built-in default endpoint,
#                   except for ollama, where empty means the host's Ollama
#                   reached from inside the container.
#   strict_schema   grammar-enforced structured output. false is allowed and
#                   recorded in run.json: such a run measures JSON-mode
#                   extraction and is not schema-comparable to strict arms,
#                   and the note must say why.
#   max_concurrent  in-flight LLM requests the eval server allows for this arm.
#   note            why this arm is configured the way it is, and the pin each
#                   recorded run of it used, so a result can always be traced
#                   to the hosts that produced it. A pin is a record, never an
#                   input: a new run builds its own with pins.py.
#
# The key is never here: every arm runs on the plugin's HINDSIGHT_LLM_API_KEY,
# swapped in the plugin's .env for a run when the arm's provider is not
# production's.
#
# Everything not listed here is copied from the production container by
# compose.py: same image, same embeddings, same retain instructions. The
# extraction model is the only variable, which is the whole point of the harness.

arms:
  - id: A
    key: dsv4pro
    provider: openrouter
    model: deepseek/deepseek-v4-pro
    base_url: ""
    strict_schema: true
    max_concurrent: 4
    note: "Baseline. Prior measurement on this exact system: 87.3% hard-token verbatim survival, median fact/source length ratio 1.27, 45 fabricated entity strings in 836. Recorded pin: [\"streamlake/fp8\",\"alibaba/fp8\",\"baidu/fp8\"]."

  - id: B
    key: dsv4flash
    provider: openrouter
    model: deepseek/deepseek-v4-flash
    base_url: ""
    strict_schema: true
    max_concurrent: 4
    note: "Cheap tier of the baseline family. Named in the plugin's own docs as having silently dropped writes without strict schema, so it is run with strict on and the drop rate measured rather than assumed. Recorded pin: [\"streamlake/fp8\",\"alibaba/fp8\",\"baidu/fp8\",\"mancer/fp8\"]."

  - id: C
    key: glm52
    provider: openrouter
    model: z-ai/glm-5.2
    base_url: ""
    strict_schema: true
    max_concurrent: 4
    note: "Second model the plugin docs flag for silent extraction loss. Routed through OpenRouter rather than z.ai direct so it shares an endpoint, and therefore a failure surface, with arms A, B and D. Recorded pin: [\"sail-research/fp8\",\"streamlake/fp8\",\"alibaba/fp8\",\"gmicloud/fp8\"]."

  - id: D
    key: qwen_or
    provider: openrouter
    model: qwen/qwen3.8-27b
    base_url: ""
    strict_schema: true
    max_concurrent: 4
    note: "Hosted half of the hosted-vs-local pair with arm E. Same weights, different runner: the delta between D and E isolates what the MLX runner costs, separately from what the model can do. Recorded pin: [\"chutes/fp8\",\"akashml/bf16\",\"reka/fp8\",\"venice/fp8\"]."

  - id: E
    key: qwen_mlx
    provider: ollama
    model: qwen3.8:27b-mlx
    base_url: "http://host.docker.internal:11434/v1"
    strict_schema: false
    max_concurrent: 1
    note: "strict_schema is false because the MLX runner does not honour Ollama's format grammar - verified, not assumed. Sending it anyway fails closed on every request. This arm therefore measures JSON-mode extraction and its results are not schema-comparable to A-D. base_url overrides the provider default because Ollama's default names localhost, which inside the container is the container. max_concurrent is 1: one MLX runner has one slot, and queueing behind it would inflate this arm's wall-clock without telling us anything about the model. Needs the machine to itself: run it with --exclusive."

  - id: F
    key: glm53flash
    provider: openrouter
    model: z-ai/glm-5.3-flash
    base_url: ""
    strict_schema: true
    max_concurrent: 4
    note: "Candidate successor to arm C at a fraction of glm-5.2's per-token price. Pinned to fp8 hosts that declare structured_outputs, per the standard pin filters, so C and F compare models rather than quantisations. Recorded pin before this harness: [\"deepinfra/fp8\",\"modal/fp8\",\"morph/fp8\",\"parasail/fp8\"]; deepinfra and parasail are production hosts now, so pins.py excludes them. Runs under this harness record their pin in pin.json."

  - id: G
    key: glm52b
    provider: openrouter
    model: z-ai/glm-5.2
    base_url: ""
    strict_schema: true
    max_concurrent: 4
    note: "Arm C's model and pin on the 0.9.2 image. The delta between C and G is the stack; the delta between G and F is the model. Separating the two is the whole reason this arm exists. Recorded pin: [\"sail-research/fp8\",\"streamlake/fp8\",\"alibaba/fp8\",\"gmicloud/fp8\"]."
