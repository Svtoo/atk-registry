[project]
name = "hindsight-cli"
version = "0.1.0"
description = "Command-line tooling for the hindsight ATK plugin"
requires-python = ">=3.11"
# typer-slim is typer without rich; 0.22 turns it into a shim that pulls rich in.
# typer-slim 0.21 imports click internals that click 9 removes.
dependencies = [
    "typer-slim>=0.16,<0.22",
    "click<9",
    "cronsim>=2.7",
]

[project.scripts]
hindsight-cli = "hindsight_cli.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hindsight_cli"]
